<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Typeset Card - Quote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    background: transparent;
    margin: 0;
    padding: 0;
  }
  :root {
    --mono: "SF Mono", "Ubuntu Mono", "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --sans: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", -apple-system, sans-serif;
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", serif;
    --bg1: #16171b;
    --bg2: #0c0d10;
    --ink: #f2f4f8;
    --dim: #8a90a0;
    --accent: #f5a623;
  }
  .card {
    width: 1080px;
    position: relative;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1) 0%, var(--bg2) 60%, #08090b 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 70px 84px 60px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .header {
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: .14em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .kicker b {
    color: var(--accent);
  }
  .rule {
    margin: 28px 0 0;
    height: 2px;
    background: linear-gradient(90deg, #2a2d36 0%, rgba(42, 45, 54, 0.4) 60%, transparent 100%);
  }
  .quote-container {
    position: relative;
    margin: 55px 0 50px;
    padding: 0 10px;
    z-index: 2;
  }
  .quote-mark {
    position: absolute;
    top: -70px;
    left: -20px;
    font-family: var(--serif);
    font-size: 200px;
    line-height: 1;
    color: var(--accent);
    opacity: 0.10;
    user-select: none;
    pointer-events: none;
  }
  .quote-text {
    position: relative;
    z-index: 2;
    font-size: 58px;
    font-weight: 700;
    line-height: 1.48;
    letter-spacing: 0.02em;
    color: var(--ink);
    word-break: break-word;
  }
  .quote-text.long-text {
    font-size: 48px;
    line-height: 1.5;
  }
  .quote-text .em {
    color: var(--accent);
    text-shadow: 0 0 24px rgba(245, 166, 35, 0.25);
  }
  .foot {
    flex-shrink: 0;
    padding-top: 30px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--dim);
    letter-spacing: .03em;
    position: relative;
    z-index: 2;
  }
  .foot .author {
    color: #aab2c4;
    font-weight: 600;
  }
  .foot .source {
    color: var(--dim);
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="grid"></div>
    <div class="header">
      <div class="kicker">{{KICKER}}</div>
      <div class="rule"></div>
    </div>
    <div class="quote-container">
      <div class="quote-mark">“</div>
      <div class="quote-text {{QUOTE_CLASS}}">{{QUOTE}}</div>
    </div>
    <div class="foot">
      <div class="author">{{AUTHOR}}</div>
      <div class="source">{{FOOTER_RIGHT}}</div>
    </div>
  </div>
</body>
</html>
