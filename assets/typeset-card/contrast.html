<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Typeset Card - Contrast</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: auto;
    background: transparent;
    margin: 0;
    padding: 0;
  }
  :root {
    --mono: "SF Mono", "Ubuntu Mono", "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --sans: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", -apple-system, sans-serif;
    --bg1: #16171b;
    --bg2: #0c0d10;
    --ink: #f2f4f8;
    --dim: #8a90a0;
    --accent: #f5a623;
    --bad: #ff6b6b;
    --bad-border: rgba(255, 107, 107, 0.25);
    --bad-bg: rgba(255, 107, 107, 0.05);
    --good: #2ecc71;
    --good-border: #2ecc71;
    --good-bg: rgba(46, 204, 113, 0.10);
    --good-glow: rgba(46, 204, 113, 0.12);
  }
  .card {
    width: 1080px;
    position: relative;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1) 0%, var(--bg2) 60%, #08090b 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    padding: 70px 74px 60px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .header {
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: .14em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .kicker b {
    color: var(--accent);
  }
  .hero {
    margin-top: 24px;
    font-size: 58px;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: .01em;
    color: #fff;
    word-break: break-word;
  }
  .hero .em {
    color: var(--accent);
  }
  .rule {
    margin: 28px 0 32px;
    height: 2px;
    background: linear-gradient(90deg, #2a2d36 0%, rgba(42, 45, 54, 0.4) 60%, transparent 100%);
  }
  .stack {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 32px;
  }
  .card-bad, .card-good {
    border-radius: 20px;
    padding: 30px 32px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(10px);
    position: relative;
  }
  .card-bad {
    background: linear-gradient(180deg, var(--bad-bg) 0%, rgba(20, 21, 26, 0.70) 100%);
    border: 2px solid var(--bad-border);
  }
  .card-good {
    background: linear-gradient(180deg, var(--good-bg) 0%, rgba(20, 21, 26, 0.85) 100%);
    border: 2px solid var(--good-border);
    box-shadow: 0 0 35px var(--good-glow), inset 0 0 25px rgba(46, 204, 113, 0.04);
  }
  .card-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 20px;
    padding: 8px 18px;
    border-radius: 10px;
    width: fit-content;
  }
  .tag-bad {
    color: #ff8585;
    background: rgba(255, 107, 107, 0.08);
    border: 1px solid rgba(255, 107, 107, 0.22);
  }
  .tag-good {
    color: #2ecc71;
    background: rgba(46, 204, 113, 0.16);
    border: 1px solid rgba(46, 204, 113, 0.5);
    box-shadow: 0 0 16px rgba(46, 204, 113, 0.25);
  }
  .shift-node {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 4px 0;
    position: relative;
    user-select: none;
  }
  .shift-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.12) 40%, rgba(46, 204, 113, 0.35) 100%);
  }
  .shift-line:last-child {
    background: linear-gradient(90deg, rgba(46, 204, 113, 0.35) 0%, rgba(255, 255, 255, 0.12) 60%, transparent 100%);
  }
  .shift-pill {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .08em;
    color: #2ecc71;
    background: rgba(46, 204, 113, 0.08);
    border: 1px solid rgba(46, 204, 113, 0.38);
    box-shadow: 0 0 20px rgba(46, 204, 113, 0.15);
    padding: 8px 24px;
    border-radius: 999px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .card-body {
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-size: 28px;
    line-height: 1.6;
    color: #dfe3ec;
  }
  .point-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .point-bullet {
    flex-shrink: 0;
    width: 26px;
    font-weight: 800;
    font-size: 28px;
    line-height: 1.5;
  }
  .bullet-bad {
    color: var(--bad);
    opacity: 0.75;
  }
  .bullet-good {
    color: var(--good);
    text-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
  }
  .point-badge {
    display: inline-flex;
    align-items: center;
    font-family: var(--mono);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 10px;
    border-radius: 6px;
    flex-shrink: 0;
    line-height: 1.5;
    vertical-align: middle;
  }
  .card-bad .point-badge {
    color: #ff8585;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.25);
  }
  .card-good .point-badge {
    color: #2ecc71;
    background: rgba(46, 204, 113, 0.18);
    border: 1px solid rgba(46, 204, 113, 0.45);
    box-shadow: 0 0 10px rgba(46, 204, 113, 0.15);
  }
  .point-text {
    flex: 1;
    word-break: break-word;
    font-size: 28px;
    line-height: 1.6;
  }
  .card-bad .point-text {
    color: #c8cdd8;
  }
  .card-good .point-text {
    color: #ffffff;
    font-weight: 500;
  }
  .point-desc {
    word-break: break-word;
    font-size: 28px;
    line-height: 1.6;
    color: #dfe3ec;
    padding: 2px 0;
  }
  .card-bad .point-desc {
    color: #c8cdd8;
  }
  .card-good .point-desc {
    color: #ffffff;
  }
  .pill-bar {
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    background: linear-gradient(90deg, rgba(245, 166, 35, 0.06) 0%, rgba(245, 166, 35, 0.12) 50%, rgba(245, 166, 35, 0.06) 100%);
    border: 1.5px solid rgba(245, 166, 35, 0.45);
    box-shadow: 0 0 25px rgba(245, 166, 35, 0.12);
    border-radius: 999px;
    padding: 18px 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    font-size: 28px;
    font-weight: 700;
    color: #f2f4f8;
    margin-bottom: 28px;
  }
  .pill-bar .pill-icon {
    font-size: 30px;
    filter: drop-shadow(0 0 8px rgba(245, 166, 35, 0.5));
  }
  .pill-bar .pill-text {
    letter-spacing: .02em;
  }
  .pill-bar .pill-text b {
    color: var(--accent);
  }
  .foot {
    flex-shrink: 0;
    padding-top: 26px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--dim);
    letter-spacing: .03em;
    position: relative;
    z-index: 2;
  }
  .foot .brand {
    color: #aab2c4;
    font-weight: 600;
  }
  .foot .slogan {
    color: var(--dim);
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="grid"></div>
    <div class="header">
      <div class="kicker">{{KICKER}}</div>
      <div class="hero">{{TITLE}}</div>
      <div class="rule"></div>
    </div>
    <div class="stack">
      <div class="card-bad">
        <div class="card-tag tag-bad"><span>{{LEFT_TITLE}}</span></div>
        <div class="card-body">{{LEFT_CONTENT}}</div>
      </div>
      <div class="shift-node">
        <div class="shift-line"></div>
        <div class="shift-pill">⚡ PARADIGM SHIFT // 破局跃迁 ▼</div>
        <div class="shift-line"></div>
      </div>
      <div class="card-good">
        <div class="card-tag tag-good"><span>{{RIGHT_TITLE}}</span></div>
        <div class="card-body">{{RIGHT_CONTENT}}</div>
      </div>
    </div>
    <div class="pill-bar">
      <span class="pill-icon">💡</span>
      <span class="pill-text">{{CONCLUSION}}</span>
    </div>
    <div class="foot">
      <div class="brand">{{FOOTER_LEFT}}</div>
      <div class="slogan">{{FOOTER_RIGHT}}</div>
    </div>
  </div>
</body>
</html>
