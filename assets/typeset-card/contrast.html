<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Typeset Card - Contrast</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    background: #08090b;
  }
  :root {
    --mono: "SF Mono", "Ubuntu Mono", "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --sans: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", -apple-system, sans-serif;
    --bg1: #16171b;
    --bg2: #0c0d10;
    --ink: #f2f4f8;
    --dim: #8a90a0;
    --accent: #f5a623;
    --bad: #ff6b6b;
    --bad-border: rgba(255, 107, 107, 0.35);
    --bad-bg: rgba(255, 107, 107, 0.07);
    --good: #2ecc71;
    --good-border: rgba(46, 204, 113, 0.38);
    --good-bg: rgba(46, 204, 113, 0.07);
  }
  body {
    position: relative;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1) 0%, var(--bg2) 60%, #08090b 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .wrap {
    position: absolute;
    inset: 0;
    padding: 70px 74px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header {
    flex-shrink: 0;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: .14em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .hero {
    margin-top: 24px;
    font-size: 70px;
    font-weight: 800;
    line-height: 1.22;
    letter-spacing: .01em;
    color: #fff;
  }
  .hero .em {
    color: var(--accent);
  }
  .rule {
    margin: 28px 0 32px;
    height: 2px;
    background: linear-gradient(90deg, #2a2d36 0%, rgba(42, 45, 54, 0.4) 60%, transparent 100%);
  }
  .columns {
    display: flex;
    gap: 32px;
    flex: 1;
    align-items: stretch;
    margin-bottom: 28px;
  }
  .card {
    flex: 1;
    border-radius: 20px;
    padding: 34px 30px;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(10px);
  }
  .card-bad {
    background: linear-gradient(180deg, var(--bad-bg) 0%, rgba(20, 21, 26, 0.75) 100%);
    border: 2px solid var(--bad-border);
  }
  .card-good {
    background: linear-gradient(180deg, var(--good-bg) 0%, rgba(20, 21, 26, 0.75) 100%);
    border: 2px solid var(--good-border);
  }
  .card-tag {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 24px;
    padding: 8px 16px;
    border-radius: 10px;
    width: fit-content;
  }
  .tag-bad {
    color: var(--bad);
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.3);
  }
  .tag-good {
    color: var(--good);
    background: rgba(46, 204, 113, 0.12);
    border: 1px solid rgba(46, 204, 113, 0.3);
  }
  .card-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 18px;
    font-size: 27px;
    line-height: 1.55;
    color: #dfe3ec;
  }
  .point-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .point-bullet {
    flex-shrink: 0;
    width: 22px;
    font-weight: bold;
    font-size: 26px;
    line-height: 1.5;
  }
  .bullet-bad { color: var(--bad); }
  .bullet-good { color: var(--good); }
  .point-text {
    flex: 1;
    word-break: break-word;
  }
  .point-desc {
    word-break: break-word;
    font-size: 27px;
    line-height: 1.55;
  }
  .pill-bar {
    flex-shrink: 0;
    background: rgba(245, 166, 35, 0.08);
    border: 1.5px solid rgba(245, 166, 35, 0.35);
    border-radius: 999px;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 600;
    color: #f2f4f8;
    margin-bottom: 24px;
  }
  .pill-bar .pill-icon {
    font-size: 28px;
  }
  .pill-bar .pill-text {
    letter-spacing: .02em;
  }
  .pill-bar .pill-text b {
    color: var(--accent);
  }
  .foot {
    flex-shrink: 0;
    padding-top: 24px;
    border-top: 1px solid #23262e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--dim);
    letter-spacing: .03em;
  }
  .foot .brand {
    color: #aab2c4;
    font-weight: 600;
  }
  .foot .slogan {
    color: var(--dim);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="header">
      <div class="kicker">{{KICKER}}</div>
      <div class="hero">{{TITLE}}</div>
      <div class="rule"></div>
    </div>
    <div class="columns">
      <div class="card card-bad">
        <div class="card-tag tag-bad"><span>{{LEFT_TITLE}}</span></div>
        <div class="card-body">{{LEFT_CONTENT}}</div>
      </div>
      <div class="card card-good">
        <div class="card-tag tag-good"><span>{{RIGHT_TITLE}}</span></div>
        <div class="card-body">{{RIGHT_CONTENT}}</div>
      </div>
    </div>
    <div class="pill-bar">
      <span class="pill-icon">💡</span>
      <span class="pill-text">{{CONCLUSION}}</span>
    </div>
    <div class="foot">
      <div class="brand">{{FOOTER_LEFT}}</div>
      <div class="slogan">{{FOOTER_RIGHT}}</div>
    </div>
  </div>
</body>
</html>
