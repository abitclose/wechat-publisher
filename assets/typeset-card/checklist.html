<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Typeset Card - Checklist</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    background: #08090b;
  }
  :root {
    --mono: "SF Mono", "Ubuntu Mono", "Liberation Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    --sans: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", -apple-system, sans-serif;
    --bg1: #16171b;
    --bg2: #0c0d10;
    --ink: #f2f4f8;
    --dim: #8a90a0;
    --accent: #f5a623;
  }
  body {
    position: relative;
    background: radial-gradient(120% 80% at 50% 0%, var(--bg1) 0%, var(--bg2) 60%, #08090b 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .grid {
    position: absolute;
    inset: 0;
    opacity: 0.05;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  .wrap {
    position: absolute;
    inset: 0;
    padding: 68px 74px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header {
    flex-shrink: 0;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .kicker {
    font-family: var(--mono);
    font-size: 28px;
    letter-spacing: .14em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .tag-badge {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(245, 166, 35, 0.12);
    border: 1.5px solid rgba(245, 166, 35, 0.4);
    border-radius: 8px;
    padding: 6px 16px;
    letter-spacing: 0.06em;
  }
  .hero {
    margin-top: 24px;
    font-size: 70px;
    font-weight: 800;
    line-height: 1.22;
    letter-spacing: .01em;
    color: #fff;
  }
  .hero .em {
    color: var(--accent);
  }
  .rule {
    margin: 28px 0 32px;
    height: 2px;
    background: linear-gradient(90deg, #2a2d36 0%, rgba(42, 45, 54, 0.4) 60%, transparent 100%);
  }
  .checklist-items {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-bottom: 24px;
  }
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 26px;
    background: rgba(255, 255, 255, 0.03);
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    border-radius: 18px;
    padding: 24px 28px;
    backdrop-filter: blur(10px);
  }
  .check-badge {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: rgba(245, 166, 35, 0.14);
    border: 2px solid rgba(245, 166, 35, 0.5);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .check-content {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .check-title {
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    line-height: 1.35;
  }
  .check-desc {
    font-size: 26px;
    font-weight: 400;
    color: #9da4b4;
    line-height: 1.5;
    word-break: break-word;
  }
  .foot {
    flex-shrink: 0;
    padding-top: 24px;
    border-top: 1px solid #23262e;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 26px;
    color: var(--dim);
    letter-spacing: .03em;
  }
  .foot .brand {
    color: #aab2c4;
    font-weight: 600;
  }
  .foot .slogan {
    color: var(--dim);
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="header">
      <div class="top-row">
        <div class="kicker">{{KICKER}}</div>
        <div class="tag-badge">{{TAG}}</div>
      </div>
      <div class="hero">{{TITLE}}</div>
      <div class="rule"></div>
    </div>
    <div class="checklist-items">
      {{ITEMS}}
    </div>
    <div class="foot">
      <div class="brand">{{FOOTER_LEFT}}</div>
      <div class="slogan">{{FOOTER_RIGHT}}</div>
    </div>
  </div>
</body>
</html>
